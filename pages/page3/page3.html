<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambling</title>
    <link rel="icon" type="image/x-icon" href="/resources/a5f.jpg" />
    <link rel="stylesheet" href="style.css">
    <script src="/pages/page3/java/button.js"></script>
    <script src="/pages/page3/java/chance.js"></script>
</head>
<body>
    <img class="motivation" src="/resources/a5f.jpg" alt="">
    <img class="motivation" src="/resources/gamblecore.jpg" alt="">
    <img class="motivation" src="/resources/gambling.jpg" alt="">
    <div>
        <nav>
            <a href="/index.html" id="risky-back">Go back to mainpage</a>
        </nav>
        <div class="content">
            <h1>gamble core</h1>
            <p>take your chance to get back or earn it.</p>
            <p id="totalCash">$0</p>
            <p id="cash">...</p>
            <button id="homepage">Buy your way back for $100k</button>
            <br>
            <button id="buyluck">Buy luck ($25k)</button>
            <br>
            <p id="linkLuck">Link Luck: ...</p>
            <img id="stone" src="/resources/stone.png" alt="" width="100px">
            <br>
            <img src="/resources/a5f.jpg" alt="follower" class="cursor-gif" aria-hidden="true">

            <script>
                // follower script
                (function () {
                    const follower = document.querySelector('.cursor-gif');
                    if (!follower) return;

                    let targetX = window.innerWidth / 2;
                    let targetY = window.innerHeight / 2;
                    let x = targetX;
                    let y = targetY;
                    const ease = 0.16; // 0 (snappy) .. 1 (no movement)

                    // show on move and update target
                    function updateTarget(clientX, clientY) {
                        targetX = clientX;
                        targetY = clientY;
                        follower.style.display = 'block';
                    }

                    document.addEventListener('mousemove', (e) => updateTarget(e.clientX, e.clientY));
                    document.addEventListener('touchmove', (e) => {
                        if (e.touches && e.touches[0]) updateTarget(e.touches[0].clientX, e.touches[0].clientY);
                    }, { passive: true });

                    function animate() {
                        x += (targetX - x) * ease;
                        y += (targetY - y) * ease;
                        follower.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
                        requestAnimationFrame(animate);
                    }
                    requestAnimationFrame(animate);
                })();
            </script>
        </div>
    </div>
</body>
</html>
